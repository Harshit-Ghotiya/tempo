name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check app.js
      - run: node --check ui.js
      - run: node --check hr.js
      - run: node --check affect.js
      - run: node --check voice.js
      - run: node --check chart.js
      - run: node --check summary.js
      - run: node --check stroop.js
      - run: node --check breathe.js
      - run: node --test tests/ui.test.mjs tests/hr.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile train_guna.py tools/make_synthetic.py tools/audit_features.py tools/audit_posed_expressions.py tools/evaluate_rppg.py launcher/package_macos.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - name: Trainer smoke test on synthetic data
        run: |
          mkdir -p data
          python tools/make_synthetic.py signal data/sessions.csv
          python tools/audit_features.py data/sessions.csv
          python train_guna.py
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go launcher vet
        run: |
          mkdir -p launcher/site
          cp index.html styles.css app.js hr.js ui.js affect.js voice.js chart.js summary.js stroop.js breathe.js preset_models.json launcher/site/
          cd launcher && go vet ./...
