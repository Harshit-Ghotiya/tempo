<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 392" width="1080" height="392" role="img" aria-label="Tempo On-Device Multimodal Stress and Affect Pipeline">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#6E778B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0A84FF"/>
    </marker>
    <style>
      .title { font: 700 17px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; fill: #F5F5F7; letter-spacing: -0.2px; }
      .title-sub { font: 500 14px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; fill: #8E95A5; }
      .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #8E95A5; }
      .lane-lbl { font: 700 10.5px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.9px; }
      .box-t { font: 600 12.5px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; fill: #F5F5F7; }
      .box-s { font: 400 11px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #A1A8B8; }
      .mono { font: 500 10.5px "SF Mono", Menlo, Consolas, monospace; fill: #C7D0E0; }
      .pill { font: 600 10px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Outer Dark Surface -->
  <rect x="0" y="0" width="1080" height="392" rx="18" fill="#0B0D12" stroke="#222836" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="34" class="title">Tempo v0.8.5  <tspan class="title-sub">·  On-Device Multimodal Architecture</tspan></text>
  <text x="28" y="54" class="subtitle">Zero-cloud WebAssembly perception calibrated per user, paired with offline LOPO validation</text>

  <!-- Privacy Pill -->
  <rect x="780" y="19" width="272" height="28" rx="14" fill="#10281B" stroke="#30D158" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="798" cy="33" r="3.5" fill="#30D158"/>
  <text x="922" y="36.5" text-anchor="middle" class="pill" fill="#6EE798">100% ON-DEVICE · ZERO VIDEO UPLOAD</text>

  <!-- Stage 1 Group -->
  <rect x="24" y="76" width="1032" height="128" rx="14" fill="#121620" stroke="#232A3A" stroke-width="1"/>
  <text x="40" y="96" class="lane-lbl" fill="#64D2FF">STAGE 1  ·  IN-BROWSER REAL-TIME PIPELINE (WASM + WEBAUDIO)</text>

  <!-- Box 1: Capture -->
  <rect x="40" y="108" width="232" height="82" rx="12" fill="#171C28" stroke="#283144" stroke-width="1"/>
  <rect x="54" y="108" width="44" height="2.5" rx="1.2" fill="#0A84FF"/>
  <text x="156" y="128" text-anchor="middle" class="box-t">Webcam &amp; Clock</text>
  <text x="156" y="146" text-anchor="middle" class="box-s">MediaPipe Wasm v0.10</text>
  <text x="156" y="161" text-anchor="middle" class="box-s">478 Landmarks &amp; Pose</text>
  <text x="156" y="176" text-anchor="middle" class="box-s">52 Blendshape Activations</text>

  <line x1="274" y1="149" x2="292" y2="149" stroke="#6E778B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 2: Biomechanics -->
  <rect x="296" y="108" width="232" height="82" rx="12" fill="#171C28" stroke="#283144" stroke-width="1"/>
  <rect x="310" y="108" width="44" height="2.5" rx="1.2" fill="#64D2FF"/>
  <text x="412" y="128" text-anchor="middle" class="box-t">Biomechanics &amp; Calibration</text>
  <text x="412" y="146" text-anchor="middle" class="box-s">7 FACS AUs · Blink · Gaze</text>
  <text x="412" y="161" text-anchor="middle" class="box-s">Down-Pitch Attenuation</text>
  <text x="412" y="176" text-anchor="middle" class="mono">60s Median/MAD + FLOOR_k</text>

  <line x1="530" y1="149" x2="548" y2="149" stroke="#6E778B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 3: rPPG -->
  <rect x="552" y="108" width="232" height="82" rx="12" fill="#171C28" stroke="#283144" stroke-width="1"/>
  <rect x="566" y="108" width="44" height="2.5" rx="1.2" fill="#FF9F0A"/>
  <text x="668" y="128" text-anchor="middle" class="box-t">3-ROI rPPG (Experimental)</text>
  <text x="668" y="146" text-anchor="middle" class="box-s">YCbCr + POS (Wang 2017)</text>
  <text x="668" y="161" text-anchor="middle" class="box-s">1s Block Motion Guard</text>
  <text x="668" y="176" text-anchor="middle" class="box-s">Gaussian Lock + RMSSD</text>

  <line x1="786" y1="149" x2="804" y2="149" stroke="#6E778B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 4: Live Fusion -->
  <rect x="808" y="108" width="232" height="82" rx="12" fill="#171C28" stroke="#283144" stroke-width="1"/>
  <rect x="822" y="108" width="44" height="2.5" rx="1.2" fill="#BF5AF2"/>
  <text x="924" y="128" text-anchor="middle" class="box-t">Fusion &amp; Session UI</text>
  <text x="924" y="146" text-anchor="middle" class="box-s">4 Hz Trend · Stroop · Breathe</text>
  <text x="924" y="161" text-anchor="middle" class="box-s">SNR Opinion Pool Fusion</text>
  <text x="924" y="176" text-anchor="middle" class="mono">Opt-in CSV (Numbers Only)</text>

  <!-- Bridge Connector -->
  <path d="M 924 190 L 924 222 L 156 222 L 156 238" fill="none" stroke="#0A84FF" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
  <rect x="380" y="210" width="320" height="22" rx="11" fill="#0F1F38" stroke="#0A84FF" stroke-opacity="0.55" stroke-width="1"/>
  <text x="540" y="224.5" text-anchor="middle" class="pill" fill="#70B8FF">DERIVED METRICS CSV · NO VIDEO EXPORTED</text>

  <!-- Stage 2 Group -->
  <rect x="24" y="242" width="1032" height="128" rx="14" fill="#121620" stroke="#232A3A" stroke-width="1"/>
  <text x="40" y="262" class="lane-lbl" fill="#0A84FF">STAGE 2  ·  OFFLINE EVALUATION &amp; MODEL PIPELINE (PYTHON)</text>

  <!-- Box 5: Audits -->
  <rect x="40" y="274" width="232" height="82" rx="12" fill="#171C28" stroke="#283144" stroke-width="1"/>
  <rect x="54" y="274" width="44" height="2.5" rx="1.2" fill="#8E95A5"/>
  <text x="156" y="294" text-anchor="middle" class="box-t">Feature &amp; AU Audits</text>
  <text x="156" y="312" text-anchor="middle" class="box-s">Directional Stress Check</text>
  <text x="156" y="327" text-anchor="middle" class="box-s">7-AU Posed Selectivity</text>
  <text x="156" y="342" text-anchor="middle" class="box-s">Cross-Talk Leak Gates</text>

  <line x1="274" y1="315" x2="292" y2="315" stroke="#6E778B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 6: LOPO -->
  <rect x="296" y="274" width="232" height="82" rx="12" fill="#171C28" stroke="#283144" stroke-width="1"/>
  <rect x="310" y="274" width="44" height="2.5" rx="1.2" fill="#0A84FF"/>
  <text x="412" y="294" text-anchor="middle" class="box-t">LOPO Cross-Validation</text>
  <text x="412" y="312" text-anchor="middle" class="box-s">Subject-Held-Out Folds</text>
  <text x="412" y="327" text-anchor="middle" class="box-s">Ridge (stress_delta)</text>
  <text x="412" y="342" text-anchor="middle" class="box-s">Softmax Triguna Pool</text>

  <line x1="530" y1="315" x2="548" y2="315" stroke="#6E778B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 7: Baselines -->
  <rect x="552" y="274" width="232" height="82" rx="12" fill="#171C28" stroke="#283144" stroke-width="1"/>
  <rect x="566" y="274" width="44" height="2.5" rx="1.2" fill="#FF453A"/>
  <text x="668" y="294" text-anchor="middle" class="box-t">Dual-Baseline Gate</text>
  <text x="668" y="312" text-anchor="middle" class="box-s">vs Constant (vs_mean)</text>
  <text x="668" y="327" text-anchor="middle" class="box-s">vs Phase Mean (vs_phase)</text>
  <text x="668" y="342" text-anchor="middle" class="box-s">Bootstrap CIs + Perm Test</text>

  <line x1="786" y1="315" x2="804" y2="315" stroke="#6E778B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 8: Weight Gate -->
  <rect x="808" y="274" width="232" height="82" rx="12" fill="#171C28" stroke="#283144" stroke-width="1"/>
  <rect x="822" y="274" width="44" height="2.5" rx="1.2" fill="#30D158"/>
  <text x="924" y="294" text-anchor="middle" class="box-t">Portal Weight Gate</text>
  <text x="924" y="312" text-anchor="middle" class="mono">N &gt;= 20 &amp; vs_phase &lt; 0</text>
  <text x="924" y="327" text-anchor="middle" class="box-s">Swaps Unvalidated Priors</text>
  <text x="924" y="342" text-anchor="middle" class="box-s">Else Keeps Safe Defaults</text>
</svg>
